# Visual language inspired by the Lamborghini DESIGN.md (VoltAgent/awesome-design-md):
# true-black canvas, charcoal panels, white type, zero radius, gold reserved for primary buttons
# (applied in app.py CSS so sliders/radios stay monochrome). Dark only — darkness is the default state.
# Chart data colors come from the dataviz palette, re-validated on #000000 (see scripts/charts.py).

[theme]
base = "dark"
primaryColor = "#FFFFFF"
backgroundColor = "#000000"
secondaryBackgroundColor = "#000000"
textColor = "#FFFFFF"
borderColor = "#494949"
showWidgetBorder = true
baseRadius = "0rem"
buttonRadius = "0rem"
linkColor = "#FFCE3E"
greenColor = "#0ca30c"
greenTextColor = "#0ca30c"
redColor = "#d03b3b"
redTextColor = "#e66767"
blueColor = "#969696"
blueBackgroundColor = "#202020"
blueTextColor = "#F5F5F5"
yellowBackgroundColor = "#202020"
yellowTextColor = "#FFCE3E"
dataframeHeaderBackgroundColor = "#181818"
dataframeBorderColor = "#202020"
chartCategoricalColors = ["#b88a00", "#3987e5", "#e66767", "#9085e9", "#199e70", "#d95926"]

[server]
headless = true
